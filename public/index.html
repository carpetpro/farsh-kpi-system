<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>داشبورد جامع مدیریت و پایش کسب‌وکار</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; font-family: Tahoma, Arial, sans-serif; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
    .login-box { max-width: 400px; margin: 80px auto; padding: 25px; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
  </style>
</head>
<body>

  <!-- فرم ورود -->
  <div id="loginSection" class="login-box">
    <h4 class="text-center mb-4">ورود به سامانه پایش کسب‌وکار</h4>
    <div id="loginAlert" class="alert alert-danger d-none"></div>
    <div class="mb-3">
      <label class="form-label">نام کاربری</label>
      <input type="text" id="usernameInput" class="form-control" placeholder="مثلا: admin یا alone_shoes">
    </div>
    <div class="mb-3">
      <label class="form-label">رمز عبور</label>
      <input type="password" id="passwordInput" class="form-control" placeholder="123456">
    </div>
    <button onclick="login()" class="btn btn-primary w-100">ورود به داشبورد</button>
  </div>

  <!-- پنل اصلی داشبورد -->
  <div id="dashboardSection" class="container py-4 d-none">
    <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm">
      <div>
        <h4 id="welcomeTitle" class="m-0">داشبورد مدیریتی</h4>
        <small id="userRoleBadge" class="badge bg-info mt-1"></small>
      </div>
      <button onclick="logout()" class="btn btn-outline-danger btn-sm">خروج از حساب</button>
    </div>

    <!-- بخش پروژه‌ها -->
    <div class="card">
      <div class="card-header bg-dark text-white fw-bold">🚀 پروژه‌های توسعه و تحول کسب‌وکار</div>
      <div class="card-body">
        <table class="table table-hover align-middle">
          <thead>
            <tr>
              <th>شناسه</th>
              <th>عنوان پروژه</th>
              <th>مسئول / مدیر</th>
              <th>پیشرفت</th>
              <th>وضعیت</th>
            </tr>
          </thead>
          <tbody id="projectsTable">
            <tr><td colspan="5" class="text-center">در حال دریافت اطلاعات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- بخش شاخص‌ها و عارضه‌ها -->
    <div class="row">
      <div class="col-md-7">
        <div class="card">
          <div class="card-header bg-primary text-white fw-bold">📊 شاخص‌های کلیدی عملکرد (KPIs)</div>
          <div class="card-body">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>عنوان شاخص</th>
                  <th>دسته</th>
                  <th>مقدار فعلی</th>
                </tr>
              </thead>
              <tbody id="kpisTable">
                <tr><td colspan="3" class="text-center">در حال دریافت...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-md-5">
        <div class="card">
          <div class="card-header bg-warning text-dark fw-bold">⚠️ عارضه‌ها و مشکلات شناسایی‌شده</div>
          <div class="card-body">
            <ul class="list-group" id="issuesList">
              <li class="list-group-item">در حال دریافت...</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function login() {
      const u = document.getElementById('usernameInput').value;
      const p = document.getElementById('passwordInput').value;
      const alert = document.getElementById('loginAlert');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ username: u, password: p })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          showDashboard(data.user);
        } else {
          alert.innerText = data.message;
          alert.classList.remove('d-none');
        }
      } catch(e) {
        alert.innerText = 'ارتباط با سرور برقرار نشد.';
        alert.classList.remove('d-none');
      }
    }

    function showDashboard(user) {
      document.getElementById('loginSection').classList.add('d-none');
      document.getElementById('dashboardSection').classList.remove('d-none');
      document.getElementById('welcomeTitle').innerText = 'داشبورد ' + user.name;
      document.getElementById('userRoleBadge').innerText = user.role === 'admin' ? 'مدیر کل سیستم (Super Admin)' : 'مدیر کسب‌وکار (الون شوز)';

      loadDashboardData();
    }

    async function loadDashboardData() {
      // دریافت پروژه‌ها
      const resPrj = await fetch('/api/projects');
      const projects = await resPrj.json();
      const prjBody = document.getElementById('projectsTable');
      prjBody.innerHTML = projects.map(p => `
        <tr>
          <td><b>${p.id}</b></td>
          <td>${p.title}</td>
          <td>${p.owner}</td>
          <td>
            <div class="progress" style="height: 18px;">
              <div class="progress-bar bg-success" style="width: ${p.progress}%">${p.progress}%</div>
            </div>
          </td>
          <td><span class="badge bg-primary">${p.status}</span></td>
        </tr>
      `).join('') || '<tr><td colspan="5" class="text-center">هیچ پروژه‌ای یافت نشد.</td></tr>';

      // دریافت شاخص‌ها
      const resKpi = await fetch('/api/kpis');
      const kpis = await resKpi.json();
      document.getElementById('kpisTable').innerHTML = kpis.map(k => `
        <tr>
          <td>${k.title}</td>
          <td><span class="badge bg-secondary">${k.category}</span></td>
          <td><b>${k.value} ${k.unit}</b></td>
        </tr>
      `).join('') || '<tr><td colspan="3" class="text-center">شاخصی ثبت نشده.</td></tr>';

      // دریافت عارضه‌ها
      const resIss = await fetch('/api/issues');
      const issues = await resIss.json();
      document.getElementById('issuesList').innerHTML = issues.map(i => `
        <li class="list-group-item d-flex justify-content-between align-items-center">
          ${i.title}
          <span class="badge bg-danger">${i.priority}</span>
        </li>
      `).join('') || '<li class="list-group-item">عارضه‌ای ثبت نشده.</li>';
    }

    function logout() {
      localStorage.removeItem('currentUser');
      location.reload();
    }
  </script>
</body>
</html>
